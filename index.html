<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BNB Agent ID Monitor — Maintenance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,180,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,180,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPulse 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .container {
      text-align: center;
      padding: 48px 32px;
      max-width: 560px;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 170, 0, 0.12);
      border: 1px solid rgba(255, 170, 0, 0.35);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffaa00;
      margin-bottom: 36px;
    }

    .badge .dot {
      width: 7px;
      height: 7px;
      background: #ffaa00;
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .logo {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00ffb4;
      margin-bottom: 20px;
      opacity: 0.7;
    }

    h1 {
      font-size: clamp(28px, 6vw, 46px);
      font-weight: 700;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.15;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #00ffb4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #888;
      font-family: system-ui, -apple-system, sans-serif;
      margin-bottom: 40px;
    }

    p strong {
      color: #ccc;
    }

    .status-box {
      background: rgba(0, 255, 180, 0.04);
      border: 1px solid rgba(0, 255, 180, 0.12);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 36px;
      text-align: left;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .status-row:last-child { border-bottom: none; }

    .status-label { color: #666; }

    .status-val {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .ok { color: #00ffb4; }
    .warn { color: #ffaa00; }

    .footer {
      font-size: 12px;
      color: #444;
      letter-spacing: 0.08em;
    }

    .footer a {
      color: #00ffb4;
      text-decoration: none;
      opacity: 0.7;
    }

    .footer a:hover { opacity: 1; }

    /* Glow orb */
    .orb {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,180,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: orbPulse 6s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="orb"></div>

  <div class="container">
    <div class="logo">⬡ BNB Agent ID Monitor</div>

    <div class="badge">
      <span class="dot"></span>
      Scheduled Maintenance
    </div>

    <h1>Back Shortly</h1>

    <p>
      We're upgrading our infrastructure for <strong>better performance</strong>.<br/>
      New features dropping soon. Won't be long.
    </p>

    <div class="status-box">
      <div class="status-row">
        <span class="status-label">Chain Scanner</span>
        <span class="status-val ok">● Live</span>
      </div>
      <div class="status-row">
        <span class="status-label">Web Interface</span>
        <span class="status-val warn">● Maintenance</span>
      </div>
      <div class="status-row">
        <span class="status-label">Market Data</span>
        <span class="status-val ok">● Syncing</span>
      </div>
    </div>

    <div class="footer">
      Follow updates →
      <a href="https://twitter.com/intent/search?q=%23BNBAgentID" target="_blank">@BNBAgentID</a>
    </div>
  </div>
</body>
</html>

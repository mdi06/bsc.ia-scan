# Runs the whole test suite on every pull request (and on a push to main), so a red build is seen before the merge, not after the
# API has redeployed. It needs no secrets and talks to no database: no SUPABASE_* variable exists here, so db.py uses SQLite.
#
# Python 3.10 is the version the pins in requirements.txt were tested on. The JS tests and the build run on the Node the
# frontend deploys with (package.json "engines").
#
# To make this a gate rather than a warning: GitHub -> Settings -> Branches -> add a rule for `main` -> "Require status checks to
# pass before merging" -> select "tests".
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Python tests
        run: python -m pytest -q

      - name: JavaScript tests
        run: |
          fail=0
          for t in tests/test_*.js; do
            if node "$t" > /dev/null 2>&1; then echo "ok   $t"; else echo "FAIL $t"; node "$t" 2>&1 | tail -15; fail=1; fi
          done
          exit $fail

      - name: Build and check the minified bundle
        run: |
          npm run build
          npm run check:minified

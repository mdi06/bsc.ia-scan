# Pings the Render backend every 10 minutes so the free instance does not spin down (it sleeps after
# 15 minutes without traffic and then takes ~35 s to answer). /healthz is a tiny response, so this adds
# almost nothing to Render's bandwidth. Delete this file if the service moves to an always-on plan.
#
# GitHub runs scheduled workflows only on the default branch, may delay them by several minutes under
# load, and disables them after 60 days without repository activity.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 5 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://bsc-ia-scan.onrender.com/healthz

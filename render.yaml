services:
  - type: web
    name: agent-id-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # API only: the worker (block scanning) runs on a separate host, see DEPLOY_WORKER.md. It downloads every
      # BSC block, far beyond the free tier's 5 GB/month bandwidth.
      - key: RUN_WORKER
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Studio Demo Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      background: #02070c;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Ambient background gradient & soft edge glow - Screen Studio style */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 18% 25%, rgba(0, 240, 255, 0.16) 0%, transparent 45%),
                  radial-gradient(circle at 82% 75%, rgba(240, 185, 11, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 50% 50%, rgba(2, 32, 28, 0.5) 0%, transparent 70%);
      pointer-events: none;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Virtual Camera Stage */
    #camera-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* macOS Window Container */
    .window-container {
      position: absolute;
      left: 200px;
      top: 90px;
      width: 1520px;
      height: 900px;
      background: #040c12;
      border-radius: 16px;
      box-shadow: 0 35px 110px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* macOS Window Titlebar */
    .window-titlebar {
      height: 42px;
      background: #07131d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      position: relative;
    }
    .window-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; border: 1px solid #e0443e; }
    .dot-yellow { background: #ffbd2e; border: 1px solid #dea123; }
    .dot-green { background: #27c93f; border: 1px solid #1aab29; }

    .window-urlbar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 440px;
      height: 26px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-family: monospace;
      color: #94a3b8;
    }
    .url-lock {
      font-size: 11px;
      color: #00ff88;
    }

    /* App Frame */
    .app-frame {
      flex: 1;
      width: 100%;
      height: calc(100% - 42px);
      border: none;
      background: #03080c;
    }

    /* Custom Floating Mouse Cursor */
    #cursor-wrapper {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 999999;
      transform-origin: 3px 3px;
    }
    .cursor-svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6));
    }
    .click-ripple {
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(0, 240, 255, 0.9);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <!-- Virtual Camera Stage -->
  <div id="camera-stage">
    <div class="window-container">
      <div class="window-titlebar">
        <div class="window-dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="window-urlbar">
          <span class="url-lock">🔒</span> agent-id-monitor.vercel.app
        </div>
      </div>
      <iframe class="app-frame" id="appIframe" src="http://127.0.0.1:8099/index.html"></iframe>
    </div>

    <!-- Animated High-DPI Cursor -->
    <div id="cursor-wrapper">
      <svg class="cursor-svg" viewBox="0 0 24 24" fill="none">
        <path d="M3 2L19 14L11.5 15.5L8 22L3 2Z" fill="#ffffff" stroke="#111111" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <div class="click-ripple" id="clickRipple"></div>
    </div>
  </div>

  <script>
    // Smoothstep interpolation
    function smoothstep(min, max, value) {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    const stage = document.getElementById("camera-stage");
    const cursor = document.getElementById("cursor-wrapper");
    const ripple = document.getElementById("clickRipple");
    const iframe = document.getElementById("appIframe");

    // Helper to get exact screen coordinates of elements inside the iframe
    function getIframeElementCoords(selector, defaultCoords, offsetX = 0, offsetY = 0) {
      try {
        const doc = iframe.contentWindow && iframe.contentWindow.document;
        if (!doc) return defaultCoords;
        const el = doc.querySelector(selector);
        if (!el) return defaultCoords;
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) return defaultCoords;
        return [
          200 + r.left + (r.width / 2) + offsetX,
          132 + r.top + (r.height / 2) + offsetY
        ];
      } catch (e) {
        return defaultCoords;
      }
    }

    // Dynamic keyframe generator based on real DOM geometry
    function getDynamicTrajectories() {
      // 1. Precise positions of elements inside iframe
      const [r2X, r2Y] = getIframeElementCoords('#tableBody tr:nth-child(2) td:nth-child(3)', [560, 520]);
      const [favX, favY] = getIframeElementCoords('.modal-fav-btn', [1120, 240]);
      const [closeX, closeY] = getIframeElementCoords('#inspectModal .modal-close-btn', [1240, 240]);
      const [smartX, smartY] = getIframeElementCoords('#tabSmart', [520, 218]);
      const [bannerX, bannerY] = getIframeElementCoords('#topProfitBanner', [720, 340]);

      // Dynamic Camera trajectory: perfectly centered and balanced framing
      const cameraKeyframes = [
        [0.0,  1.0,   960, 540],     // Wide establishing shot
        [1.6,  1.0,   960, 540],     // Start smooth zoom
        [2.7,  1.26,  900, r2Y],     // Frame Row 2 elegantly (centered horizontally)
        [3.4,  1.26,  900, r2Y],     // Hold on Row 2 click
        [4.2,  1.24,  960, 540],     // Smooth transition to centered modal
        [6.8,  1.24,  960, 540],     // Inspecting modal
        [7.5,  1.24,  960, 540],     // Close modal click
        [8.3,  1.32,  760, smartY + 80], // Smoothly focus on Tab bar & top table
        [10.4, 1.32,  760, smartY + 80], // Hold on Smart Alpha view
        [11.2, 1.22,  bannerX, bannerY + 20], // Pan across profit banner
        [12.4, 1.0,   960, 540],     // Smooth pull out to full window
        [14.0, 1.0,   960, 540]      // Rest
      ];

      // Dynamic Cursor trajectory (snaps exactly to buttons with visible tactile clicks)
      const cursorKeyframes = [
        [0.0,  1400, 750, false],
        [1.5,  1050, 640, false],
        [2.6,  r2X + 60, r2Y, false],   // Arrive directly on Row 2 project name
        [3.0,  r2X + 60, r2Y, true],    // Click Row 2
        [3.3,  r2X + 60, r2Y, false],   // Release
        [4.2,  860,  460, false],        // Glide over Security analysis in modal
        [5.2,  860,  660, false],        // Glide over Smart Money stats
        [6.1,  favX, favY, false],       // Hover directly over "★ Favorite"
        [6.4,  favX, favY, true],        // Click Favorite (modal switches to "+ Favorited")
        [6.7,  favX, favY, false],
        [7.1,  closeX, closeY, false],   // Hover directly over "✕ [ESC]" Close button
        [7.3,  closeX, closeY, true],    // Click Close
        [7.5,  closeX, closeY, false],   // Release click
        [8.3,  smartX, smartY, false],   // Hover directly over "2: Smart Alpha"
        [8.6,  smartX, smartY, true],    // Click Smart Alpha Tab
        [8.9,  smartX, smartY, false],
        [10.0, bannerX, bannerY, false], // Glide over Top Profit banner
        [11.4, 820, 520, false],         // Glide across alpha table
        [12.8, 960, 620, false],         // Centered rest
        [14.0, 960, 620, false]
      ];

      return { cameraKeyframes, cursorKeyframes };
    }

    function evaluateTrajectory(keyframes, t) {
      if (t <= keyframes[0][0]) return keyframes[0].slice(1);
      if (t >= keyframes[keyframes.length - 1][0]) return keyframes[keyframes.length - 1].slice(1);

      for (let i = 0; i < keyframes.length - 1; i++) {
        const k0 = keyframes[i];
        const k1 = keyframes[i + 1];
        if (t >= k0[0] && t <= k1[0]) {
          const progress = smoothstep(k0[0], k1[0], t);
          const result = [];
          for (let j = 1; j < k0.length; j++) {
            if (typeof k0[j] === 'boolean') {
              result.push(k0[j] || (k1[j] && progress > 0.85));
            } else {
              result.push(lerp(k0[j], k1[j], progress));
            }
          }
          return result;
        }
      }
      return keyframes[0].slice(1);
    }

    // App event triggers
    let row2Triggered = false;
    let favTriggered = false;
    let closeTriggered = false;
    let smartTabTriggered = false;
    let cachedTrajectories = null;

    window.setVideoTime = function(t) {
      if (!cachedTrajectories || t < 0.1) {
        cachedTrajectories = getDynamicTrajectories();
      }
      const { cameraKeyframes, cursorKeyframes } = cachedTrajectories;

      // 1. Evaluate Camera Position
      const [scale, focusX, focusY] = evaluateTrajectory(cameraKeyframes, t);
      const transX = 960 - (focusX * scale);
      const transY = 540 - (focusY * scale);
      stage.style.transform = `translate(${transX.toFixed(2)}px, ${transY.toFixed(2)}px) scale(${scale.toFixed(3)})`;

      // 2. Evaluate Cursor Position & Click
      const [curX, curY, isClick] = evaluateTrajectory(cursorKeyframes, t);
      cursor.style.transform = `translate(${curX.toFixed(1)}px, ${curY.toFixed(1)}px)`;

      if (isClick) {
        cursor.style.transform += ` scale(0.88)`;
        ripple.style.opacity = "1";
        ripple.style.transform = "translate(-50%, -50%) scale(2.6)";
        ripple.style.borderColor = "rgba(0, 240, 255, 0.9)";
      } else {
        ripple.style.opacity = "0";
        ripple.style.transform = "translate(-50%, -50%) scale(0)";
      }

      // 3. Iframe state triggers
      try {
        const doc = iframe.contentWindow && iframe.contentWindow.document;
        if (!doc) return;

        // At t = 3.0s: Click row 2 to open modal
        if (t >= 3.0 && t < 7.4 && !row2Triggered) {
          row2Triggered = true;
          closeTriggered = false;
          const rows = doc.querySelectorAll('#tableBody tr');
          if (rows[1]) rows[1].click();
        }

        // At t = 6.4s: Click Favorite
        if (t >= 6.4 && !favTriggered) {
          favTriggered = true;
          const favBtn = doc.querySelector('.modal-fav-btn');
          if (favBtn) favBtn.click();
        }

        // At t = 7.4s: Close modal
        if (t >= 7.4 && !closeTriggered) {
          closeTriggered = true;
          row2Triggered = false;
          const modal = doc.getElementById('inspectModal');
          if (modal && modal.open) modal.close();
        }

        // At t = 8.6s: Click Smart Alpha Tab
        if (t >= 8.6 && !smartTabTriggered) {
          smartTabTriggered = true;
          const tabSmart = doc.getElementById('tabSmart');
          if (tabSmart) tabSmart.click();
        }

        // Reset if rewound
        if (t < 2.5) {
          row2Triggered = false;
          favTriggered = false;
          closeTriggered = false;
          smartTabTriggered = false;
          const tabRadar = doc.getElementById('tabRadar');
          if (tabRadar && !tabRadar.classList.contains('active')) tabRadar.click();
          const modal = doc.getElementById('inspectModal');
          if (modal && modal.open) modal.close();
        }
      } catch (e) {
        // loading
      }
    };
  </script>
</body>
</html>

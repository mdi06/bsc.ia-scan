<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Studio Demo Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      background: #02070c;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Ambient background gradient & soft edge glow - Screen Studio style */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 18% 25%, rgba(0, 240, 255, 0.16) 0%, transparent 45%),
                  radial-gradient(circle at 82% 75%, rgba(240, 185, 11, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 50% 50%, rgba(2, 32, 28, 0.5) 0%, transparent 70%);
      pointer-events: none;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Virtual Camera Stage */
    #camera-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* macOS Window Container */
    .window-container {
      position: absolute;
      left: 200px;
      top: 90px;
      width: 1520px;
      height: 900px;
      background: #040c12;
      border-radius: 16px;
      box-shadow: 0 35px 110px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* macOS Window Titlebar */
    .window-titlebar {
      height: 42px;
      background: #07131d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      position: relative;
    }
    .window-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; border: 1px solid #e0443e; }
    .dot-yellow { background: #ffbd2e; border: 1px solid #dea123; }
    .dot-green { background: #27c93f; border: 1px solid #1aab29; }

    .window-urlbar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 440px;
      height: 26px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-family: monospace;
      color: #94a3b8;
    }
    .url-lock {
      font-size: 11px;
      color: #00ff88;
    }

    /* App Frame */
    .app-frame {
      flex: 1;
      width: 100%;
      height: calc(100% - 42px);
      border: none;
      background: #03080c;
    }

    /* Custom Floating Mouse Cursor */
    #cursor-wrapper {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 999999;
      transform-origin: 3px 3px;
    }
    .cursor-svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6));
    }
    .click-ripple {
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(0, 240, 255, 0.9);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <!-- Virtual Camera Stage -->
  <div id="camera-stage">
    <div class="window-container">
      <div class="window-titlebar">
        <div class="window-dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="window-urlbar">
          <span class="url-lock">🔒</span> agent-id-monitor.vercel.app
        </div>
      </div>
      <iframe class="app-frame" id="appIframe" src="http://127.0.0.1:8099/index.html"></iframe>
    </div>

    <!-- Animated High-DPI Cursor -->
    <div id="cursor-wrapper">
      <svg class="cursor-svg" viewBox="0 0 24 24" fill="none">
        <path d="M3 2L19 14L11.5 15.5L8 22L3 2Z" fill="#ffffff" stroke="#111111" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <div class="click-ripple" id="clickRipple"></div>
    </div>
  </div>

  <script>
    // Smoothstep interpolation
    function smoothstep(min, max, value) {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    const stage = document.getElementById("camera-stage");
    const cursor = document.getElementById("cursor-wrapper");
    const ripple = document.getElementById("clickRipple");
    const iframe = document.getElementById("appIframe");

    // Helper to get exact screen coordinates of elements inside the iframe
    function getIframeElementCoords(selector, defaultCoords, offsetX = 0, offsetY = 0) {
      try {
        const doc = iframe.contentWindow && iframe.contentWindow.document;
        if (!doc) return defaultCoords;
        const el = doc.querySelector(selector);
        if (!el) return defaultCoords;
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) return defaultCoords;
        return [
          200 + r.left + (r.width / 2) + offsetX,
          132 + r.top + (r.height / 2) + offsetY
        ];
      } catch (e) {
        return defaultCoords;
      }
    }

    // Dynamic keyframe generator based on real DOM geometry
    function getDynamicTrajectories() {
      // 1. Precise positions of elements inside iframe
      const [r1X, r1Y] = getIframeElementCoords('#tableBody tr:first-child td:nth-child(5)', [560, 480]);
      const [favX, favY] = getIframeElementCoords('.modal-fav-btn', [1120, 240]);
      const [closeX, closeY] = getIframeElementCoords('#inspectModal .modal-close-btn', [1240, 240]);

      // Dynamic Camera trajectory: perfectly centered and balanced framing for 10s video
      const cameraKeyframes = [
        [0.0,  1.0,   960, 540],     // Wide establishing shot of radar
        [1.0,  1.0,   960, 540],     // Start glide towards asset
        [1.8,  1.18,  880, r1Y + 30], // Smooth zoom approaching Row 1 asset
        [2.0,  1.18,  880, r1Y + 30], // Tap / Click on asset row
        [2.8,  1.42,  960, 460],     // Smooth cinematic zoom into Inspect Modal
        [4.8,  1.45,  960, 450],     // Focus on Contract, Dev Funding Root & Dev Syndicate
        [6.8,  1.45,  960, 570],     // Pan down across Holder Distribution & Security Audit
        [8.4,  1.40,  960, 640],     // Focus on 1-Click Mint / Sniper CLI
        [10.0, 1.25,  960, 540]      // Elegant hero pull-back framing full modal
      ];

      // Dynamic Cursor trajectory (smooth glide, tap click with ripple, then inspects info)
      const cursorKeyframes = [
        [0.0,  1350, 720, false],
        [1.0,  1080, 580, false],
        [1.8,  r1X + 40, r1Y, false],   // Arrive directly on Row 1 asset
        [2.0,  r1X + 40, r1Y, true],    // TAP / CLICK asset! (tactile click ripple)
        [2.3,  r1X + 40, r1Y, false],   // Release
        [3.5,  800,  400, false],        // Glide over Token Name & Contract address
        [4.8,  840,  450, false],        // Glide over Dev Funding Root & Dev Syndicate Cluster
        [6.2,  840,  550, false],        // Glide across Holder Distribution spectrum bar
        [7.4,  900,  620, false],        // Glide over Security & Anti-Rug Audit
        [8.6,  960,  690, false],        // Hover over 1-Click Web3 Direct Mint button
        [9.5,  1100, 740, false],       // Smooth rest
        [10.0, 1100, 740, false]
      ];

      return { cameraKeyframes, cursorKeyframes };
    }

    function evaluateTrajectory(keyframes, t) {
      if (t <= keyframes[0][0]) return keyframes[0].slice(1);
      if (t >= keyframes[keyframes.length - 1][0]) return keyframes[keyframes.length - 1].slice(1);

      for (let i = 0; i < keyframes.length - 1; i++) {
        const k0 = keyframes[i];
        const k1 = keyframes[i + 1];
        if (t >= k0[0] && t <= k1[0]) {
          const progress = smoothstep(k0[0], k1[0], t);
          const result = [];
          for (let j = 1; j < k0.length; j++) {
            if (typeof k0[j] === 'boolean') {
              result.push(k0[j] || (k1[j] && progress > 0.85));
            } else {
              result.push(lerp(k0[j], k1[j], progress));
            }
          }
          return result;
        }
      }
      return keyframes[0].slice(1);
    }

    // App event triggers
    let rowTriggered = false;
    let cachedTrajectories = null;

    window.setVideoTime = function(t) {
      if (!cachedTrajectories || t < 0.1) {
        cachedTrajectories = getDynamicTrajectories();
      }
      const { cameraKeyframes, cursorKeyframes } = cachedTrajectories;

      // 1. Evaluate Camera Position
      const [scale, focusX, focusY] = evaluateTrajectory(cameraKeyframes, t);
      const transX = 960 - (focusX * scale);
      const transY = 540 - (focusY * scale);
      stage.style.transform = `translate(${transX.toFixed(2)}px, ${transY.toFixed(2)}px) scale(${scale.toFixed(3)})`;

      // 2. Evaluate Cursor Position & Click
      const [curX, curY, isClick] = evaluateTrajectory(cursorKeyframes, t);
      cursor.style.transform = `translate(${curX.toFixed(1)}px, ${curY.toFixed(1)}px)`;

      if (isClick) {
        cursor.style.transform += ` scale(0.88)`;
        ripple.style.opacity = "1";
        ripple.style.transform = "translate(-50%, -50%) scale(2.6)";
        ripple.style.borderColor = "rgba(0, 240, 255, 0.9)";
      } else {
        ripple.style.opacity = "0";
        ripple.style.transform = "translate(-50%, -50%) scale(0)";
      }

      // 3. Iframe state triggers
      try {
        const doc = iframe.contentWindow && iframe.contentWindow.document;
        if (!doc) return;

        // At t = 2.0s: Click row 1 to open modal
        if (t >= 2.0 && !rowTriggered) {
          rowTriggered = true;
          const rows = doc.querySelectorAll('#tableBody tr');
          if (rows[0]) rows[0].click();
        }

        // Smoothly scroll modal down to showcase Holder Distribution, Security, and 1-Click Mint
        if (t >= 5.5 && t <= 8.5) {
          const p = (t - 5.5) / 3.0;
          const modalContent = doc.getElementById('modalContent');
          if (modalContent) modalContent.scrollTop = lerp(0, 260, smoothstep(0, 1, p));
        } else if (t > 8.5) {
          const modalContent = doc.getElementById('modalContent');
          if (modalContent) modalContent.scrollTop = 260;
        }

        // Reset if rewound
        if (t < 1.5) {
          rowTriggered = false;
          const modal = doc.getElementById('inspectModal');
          if (modal && modal.open) modal.close();
          const modalContent = doc.getElementById('modalContent');
          if (modalContent) modalContent.scrollTop = 0;
        }
      } catch (e) {
        // loading
      }
    };
  </script>
</body>
</html>
